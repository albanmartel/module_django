{% extends "base.html" %}

{% block title %} {{ title }} {% endblock %}

{% block maintitle %} {{ title }} {% endblock %}

{% block main %}
<div style="max-width: 400px; margin: 40px auto;">
    <h2>Changer votre mot de passe</h2>

    <form action="{% url 'polls:change_password' %}" method="post">
        {% csrf_token %}

        <!-- C'est ici que Django génère les champs de l'ancien et du nouveau mot de passe -->
        {{ form.as_p }}

        <button type="submit" style="padding: 10px 15px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer;">
            Enregistrer le nouveau mot de passe
        </button>
    </form>
</div>
{% endblock %}

{% extends "base.html" %}

{% block title %}{{ title}}{% endblock %}

{% block maintitle %} {{ title }} {% endblock %}

{% block header %} {% endblock %}

{% block main %}

{% if error_message %}
    <p><strong>{{ error_message }}</strong></p>
{% endif %}
<form action="{% url 'polls:add' %}" method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <input type="submit" value="Add">
</form>

{% endblock %}

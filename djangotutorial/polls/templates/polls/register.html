{% extends "base.html" %}

{% block title %}{{ title }}{% endblock %}

{% block maintitle %} {{ title }} {% endblock %}

{% block main %}

{% if error_message %}
    <p><strong>{{ error_message }}</strong></p>
{% endif %}

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">S'inscrire</button>
</form>

{% endblock %}
